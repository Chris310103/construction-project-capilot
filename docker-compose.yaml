services:
  db:
    image: pgvector/pgvector:pg16
    container_name: construction-copilot-db

    environment:
      POSTGRES_DB: construction_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
